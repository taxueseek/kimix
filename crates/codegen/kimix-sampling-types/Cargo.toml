thiserror = { workspace = true }
tracing = { workspace = true }
kimix-compaction = { path = "../../common/kimix-compaction" }
kimix-tools = { path = "../kimix-tools" }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
