name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Install dotslash (protoc launcher)
        run: cargo install dotslash --locked

      - uses: Swatinem/rust-cache@v2

      - name: Run verification gates
        run: bash scripts/ci/quality-gates.sh
